<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Text Converter Pro</h1>
            <p>Unicode & Preeti Engine</p>
        </header>

        <main class="grid-layout">
            <!-- Panel 1: Phonetic Input -->
            <section class="card">
                <div class="card-header">
                    <span>1. Type in Roman Nepali</span>
                    <!-- Feature 2: Visual Loading State -->
                    <div id="loading-indicator" class="loading-indicator">
                        <span class="spinner-icon"></span>
                        <span>Translating...</span>
                    </div>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="roman-input" placeholder="Type phonetically in Romanized Nepali (e.g., 'namaste', 'mero desh')..."></textarea>
                </div>
            </section>

            <!-- Panel 2: Unicode Output -->
            <section class="card">
                <div class="card-header">
                    <span>2. Unicode (Web / Mobile)</span>
                    <button id="clear-all-btn" class="btn-text" type="button">Clear All</button>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="unicode-output" placeholder="Nepali Unicode output will appear here..."></textarea>
                </div>
                <div class="button-group">
                    <button id="convert-to-preeti-btn" class="btn btn-primary" type="button">Convert to Preeti ↓</button>
                    <button id="copy-unicode" class="btn btn-secondary" type="button">Copy Unicode</button>
                </div>
            </section>

            <!-- Panel 3: Preeti Preview -->
            <section class="card">
                <div class="card-header">
                    <span>3. Preeti ASCII Preview</span>
                    <div class="toggle-container">
                        <input type="checkbox" id="font-toggle" checked>
                        <label for="font-toggle">Preeti Font Styling</label>
                    </div>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="preeti-output" class="preeti-font" readonly placeholder="gd:t]"></textarea>
                </div>
                <div class="button-group">
                    <button id="copy-preeti" class="btn btn-accent" type="button">Copy for Preeti Font</button>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>Note: To display Preeti output correctly in external software (e.g., MS Word), paste the text and set your document font to <strong>'Preeti'</strong>.</p>
        </footer>
    </div>
