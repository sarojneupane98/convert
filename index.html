<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional Nepali Transliteration, Unicode and Preeti Font Converter tool.">
    <title>Nepali Converter Pro | Unicode & Preeti Engine</title>

    <!-- Font & Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://nepalifonts.net/css/preeti.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Mobile-First Layout (Default) */
        body {
            /* Adds padding at the top on mobile so your content isn't hidden under the ad */
            padding-top: 60px; 
        }

        .ad-wrapper-left {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            display: flex;
            justify-content: center;
        }

        .ad-wrapper-right {
            /* Hiding the second ad on mobile to prevent cluttering the small screen */
            display: none; 
            z-index: 9999;
        }

        /* Desktop Layout (Screens wider than 768px) */
        @media (min-width: 768px) {
            body {
                /* Remove the top padding on desktop */
                padding-top: 0; 
            }

            .ad-wrapper-left, .ad-wrapper-right {
                display: block;
                position: fixed;
                top: 50%;
                transform: translateY(-50%);
                width: auto;
            }

            .ad-wrapper-left {
                /* Moves the left ad to the left side */
                top: 50%;
                left: 10px;
            }

            .ad-wrapper-right {
                /* Displays the right ad on the right side */
                display: block;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Text Converter Pro</h1>
            <p>Unicode & Preeti Engine</p>
        </header>

        <main class="grid-layout">
            <!-- Panel 1: Phonetic Input -->
            <section class="card">
                <div class="card-header">
                    <span>1. Type in Roman Nepali</span>
                    <!-- Feature 2: Visual Loading State -->
                    <div id="loading-indicator" class="loading-indicator">
                        <span class="spinner-icon"></span>
                        <span>Translating...</span>
                    </div>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="roman-input" placeholder="Type phonetically in Romanized Nepali (e.g., 'namaste', 'mero desh')..."></textarea>
                </div>
            </section>

            <!-- Panel 2: Unicode Output -->
            <section class="card">
                <div class="card-header">
                    <span>2. Unicode (Web / Mobile)</span>
                    <button id="clear-all-btn" class="btn-text" type="button">Clear All</button>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="unicode-output" placeholder="Nepali Unicode output will appear here..."></textarea>
                </div>
                <div class="button-group">
                    <button id="convert-to-preeti-btn" class="btn btn-primary" type="button">Convert to Preeti ↓</button>
                    <button id="copy-unicode" class="btn btn-secondary" type="button">Copy Unicode</button>
                </div>
            </section>

            <!-- Panel 3: Preeti Preview -->
            <section class="card">
                <div class="card-header">
                    <span>3. Preeti ASCII Preview</span>
                    <div class="toggle-container">
                        <input type="checkbox" id="font-toggle" checked>
                        <label for="font-toggle">Preeti Font Styling</label>
                    </div>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="preeti-output" class="preeti-font" readonly placeholder="gd:t]"></textarea>
                </div>
                <div class="button-group">
                    <button id="copy-preeti" class="btn btn-accent" type="button">Copy for Preeti Font</button>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>Note: To display Preeti output correctly in external software (e.g., MS Word), paste the text and set your document font to <strong>'Preeti'</strong>.</p>
        </footer>
    </div>
